services:
  bot:
    build: .
    container_name: meoxwater-bot
    env_file:
      - .env.docker
    environment:
      - ENVIRONMENT=docker
    ports:
      - "1927:1927"
    restart: unless-stopped

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: meoxwater-napcat
    environment:
      - NAPCAT_UID=0
      - NAPCAT_GID=0
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099"
    volumes:
      - ./docker/napcat/qq-data:/app/.config/QQ
      - ./docker/napcat/config:/app/napcat/config
    restart: unless-stopped
    depends_on:
      - bot
